<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お仕事アンケート</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 20px;
            border-left: 5px solid #3498db;
            padding-left: 10px;
        }
        /* 入力欄とボタンを横並びにするスタイル */
        .survey-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .survey-group input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .survey-group button {
            padding: 12px 24px;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .survey-group button:hover {
            background-color: #2980b9;
        }
        /* 管理者確認エリアのスタイル */
        .admin-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px dashed #eee;
        }
        .admin-title {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
        .admin-auth {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .admin-auth input[type="password"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            width: 150px;
        }
        .admin-auth button {
            padding: 8px 16px;
            background-color: #2c3e50;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        .admin-auth button:hover {
            background-color: #1a252f;
        }
        /* 回答一覧の表示スタイル */
        .result-box {
            display: none;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
        }
        .result-item {
            background: #fff;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            border-left: 3px solid #2ecc71;
            font-size: 14px;
        }
        .result-time {
            font-size: 11px;
            color: #95a5a6;
            margin-bottom: 3px;
        }
        .clear-btn {
            margin-top: 15px;
            padding: 6px 12px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>【アンケート】仕事で使いたいツールは何ですか？</h2>
    
    <!-- アンケート入力・送信エリア（横並び） -->
    <div class="survey-group">
        <input type="text" id="toolInput" placeholder="ツール名や理由を文章で入力してください" required>
        <button onclick="submitSurvey()">送信</button>
    </div>

    <!-- 暗証番号・確認エリア -->
    <div class="admin-section">
        <div class="admin-title">🔑 来たアンケートを確認する（管理者用）</div>
        <div class="admin-auth">
            <input type="password" id="passwordInput" placeholder="暗証番号を入力">
            <button onclick="checkAnswers()">確認する</button>
        </div>
        
        <!-- ここに回答一覧が出現します -->
        <div id="resultBox" class="result-box">
            <h3>📥 届いた回答一覧</h3>
            <div id="answersList"></div>
            <button class="clear-btn" onclick="clearData()">データをすべて消去</button>
        </div>
    </div>
</div>

<script>
    // アンケート送信の処理
    function submitSurvey() {
        const inputField = document.getElementById('toolInput');
        const answerText = inputField.value.trim();

        if (answerText === "") {
            alert("文章を入力してください。");
            return;
        }

        // 現在の時刻を取得
        const now = new Date();
        const timeString = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

        // 保存用オブジェクトの作成
        const newAnswer = {
            time: timeString,
            text: answerText
        };

        // ローカルストレージから既存データを読み込んで追加
        let currentAnswers = JSON.parse(localStorage.getItem('surveyAnswers')) || [];
        currentAnswers.push(newAnswer);
        localStorage.setItem('surveyAnswers', JSON.stringify(currentAnswers));

        // 完了メッセージと入力欄のクリア
        alert("アンケートを送信しました。ご協力ありがとうございました！");
        inputField.value = "";
        
        // 確認画面が開いている場合はリアルタイム更新
        if (document.getElementById('resultBox').style.display === 'block') {
            displayAnswers();
        }
    }

    // 暗証番号チェックの処理
    function checkAnswers() {
        const passwordInput = document.getElementById('passwordInput').value;
        const resultBox = document.getElementById('resultBox');

        // 指定の暗証番号「123456k」と一致するか判定
        if (passwordInput === "123456k") {
            resultBox.style.display = "block";
            displayAnswers();
        } else {
            alert("暗証番号が違います。");
            resultBox.style.display = "none";
        }
    }

    // 画面に回答一覧を表示する処理
    function displayAnswers() {
        const answersList = document.getElementById('answersList');
        const currentAnswers = JSON.parse(localStorage.getItem('surveyAnswers')) || [];

        if (currentAnswers.length === 0) {
            answersList.innerHTML = "<p style='color: #7f8c8d; font-size: 14px;'>まだ回答はありません。</p>";
            return;
        }

        // 新しい回答が上に来るように逆順で表示
        let html = "";
        for (let i = currentAnswers.length - 1; i >= 0; i--) {
            html += `
                <div class="result-item">
                    <div class="result-time">[${currentAnswers[i].time}]</div>
                    <div>${escapeHtml(currentAnswers[i].text)}</div>
                </div>
            `;
        }
        answersList.innerHTML = html;
    }

    // 安全データ表示のためのエスケープ処理
    function escapeHtml(str) {
        return str.replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;')
                  .replace(/'/g, '&#039;');
    }

    // データを消去する処理
    function clearData() {
        if (confirm("これまでのアンケート回答データをすべて削除してもよろしいですか？")) {
            localStorage.removeItem('surveyAnswers');
            displayAnswers();
        }
    }
</script>

</body>
</html>
